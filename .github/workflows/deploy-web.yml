# Deploys the Expo web build to GitHub Pages on every push (main or the
# active development branch), by publishing dist/ to the gh-pages branch —
# pushing that branch is what keeps https://<user>.github.io/<repo>/ fresh.
#
# No manual setup: creating the gh-pages branch auto-enables Pages on
# public repositories.

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, 'claude/a2z-travel-planning-mvp-4f1920']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build web bundle
        run: npm run build
        env:
          # GitHub Pages serves project sites from /<repo>/, so asset URLs
          # must be prefixed with the repo name.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA:0:7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
