# Deploys the Expo web build to GitHub Pages on every push to main
# (or manually via the Actions tab → "Deploy web to GitHub Pages" → Run workflow).
#
# One-time setup in the GitHub repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The site will be available at https://<user>.github.io/<repo>/

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build web bundle
        run: npm run build
        env:
          # GitHub Pages serves project sites from /<repo>/, so asset URLs
          # must be prefixed with the repo name.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
